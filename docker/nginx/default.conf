server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 50M;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 90;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Public tunnel target (PUBLIC_MEDIA_BASE_URL). Serves ONLY signed rendered media for Instagram to fetch;
# the dashboard, OAuth and everything else answer 404 here. Point the tunnel at 127.0.0.1:8089, never at 8088.
server {
    listen 8081;
    server_name _;
    root /var/www/html/public;
    server_tokens off;

    location ~ "^/media/[0-9A-Za-z]{26}$" {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        return 404;
    }
}
